name: PR Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "**.py"
      - "**.sql"
      - "**.sqlx"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic PyGithub

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD -- '*.py' '*.sql' '*.sqlx' > /tmp/pr_diff.txt
          DIFF_SIZE=$(wc -c < /tmp/pr_diff.txt)
          echo "diff_size=$DIFF_SIZE" >> $GITHUB_OUTPUT
          echo "Diff size: $DIFF_SIZE bytes"

      - name: Review with Claude
        if: steps.diff.outputs.diff_size != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          import anthropic
          from github import Github

          with open("/tmp/pr_diff.txt") as f:
              diff = f.read()

          # Truncate extremely large diffs
          if len(diff) > 12_000:
              diff = diff[:12_000] + "\n\n[... diff truncated — review remaining changes manually ...]"

          prompt = f"""You are a senior data scientist reviewing a pull request for a lead scoring system
built on XGBoost, BigQuery, and Dataform.

Review the diff below with focus on:

**For Python (.py) changes:**
- Data leakage risks (especially in feature engineering with time-based features)
- Statistical correctness (calibration, imbalanced class handling, metric choice)
- Pandas/NumPy efficiency and memory implications at scale
- Missing edge cases (nulls, empty DataFrames, divide-by-zero)
- Readability and docstring coverage

**For SQL/SQLX changes:**
- Partition pruning: are queries filtering on partition_date/score_date?
- Fan-out risk in JOINs (check cardinality assumptions)
- NULL handling in aggregations
- Window function correctness (PARTITION BY / ORDER BY completeness)
- Deduplication correctness
- Cost implications (full table scans, missing LIMIT on dev queries)

**Output format:**
Use this exact structure:

## Code Review

### Summary
One paragraph summary of what this PR does.

### 🔴 Issues (must fix before merge)
List blocking issues. If none, write "None found."

### 🟡 Suggestions (non-blocking improvements)
List optional improvements with brief rationale.

### 🟢 What looks good
Acknowledge 2-3 things done well.

### Verdict
One of: `APPROVE` / `REQUEST CHANGES` / `COMMENT`

Be direct and specific. Reference line context from the diff when relevant.
Do not invent issues that aren't visible in the diff.

DIFF:
```diff
{diff}
```"""

          client = anthropic.Anthropic()
          message = client.messages.create(
              model="claude-sonnet-4-20250514",
              max_tokens=2048,
              messages=[{"role": "user", "content": prompt}],
          )
          review_body = message.content[0].text

          # Post as PR comment via GitHub API
          gh = Github(os.environ["GITHUB_TOKEN"])
          repo = gh.get_repo(os.environ["GITHUB_REPOSITORY"])
          pr = repo.get_pull(int(os.environ["PR_NUMBER"]))
          pr.create_issue_comment(
              f"🤖 **Automated Code Review**\n\n{review_body}\n\n---\n*Generated by Claude — review suggestions critically before acting on them.*"
          )
          print("Review posted successfully")
          EOF
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
